# Publishes the website to GitHub Pages on every push to main, using site.config.json:
#  - appsScriptUrl set: the live site, connected to the Google Sheets backend (apps-script/README.md)
#  - appsScriptUrl empty: a demo with sample data that runs in the visitor's browser
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build website
        run: node dev/build-from-config.mjs _site "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
